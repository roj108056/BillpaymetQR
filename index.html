<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Payment QR Code Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/promptpay-qr@0.5.0/dist/promptpay-qr.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl max-w-md w-full">
        <h1 class="text-2xl font-bold text-slate-800 text-center mb-6">สร้าง QR Code ชำระเงิน (Bill Payment)</h1>

        <form id="qrForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Tax ID / เลขประจำตัวผู้เสียภาษี (13 หลัก)</label>
                <input type="text" id="taxId" maxlength="13" placeholder="1234567890123" required 
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div class="col-span-1">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Suffix (2 หลัก)</label>
                    <input type="text" id="suffix" maxlength="2" value="00" required 
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-center">
                </div>
                <div class="col-span-2">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">จำนวนเงิน (บาท)</label>
                    <input type="number" id="amount" step="0.01" max="9999999999999.99" placeholder="0.00" 
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Reference 1 (สูงสุด 20 หลัก)</label>
                <input type="text" id="ref1" maxlength="20" placeholder="REF123456789" required 
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Reference 2 (สูงสุด 20 หลัก - ถ้ามี)</label>
                <input type="text" id="ref2" maxlength="20" placeholder="REF223456789" 
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="button" onclick="generateQRCode()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 mt-2">
                สร้าง QR Code
            </button>
        </form>

        <div id="result" class="mt-6 flex flex-col items-center justify-center hidden border-t border-slate-200 pt-6">
            <div id="qrcode" class="bg-white p-3 border rounded-xl shadow-sm"></div>
            <p class="text-xs text-slate-500 mt-3 text-center break-all max-w-xs" id="rawPayload"></p>
        </div>
    </div>

    <script>
        let qrcodeObj = null;

        function generateQRCode() {
            const taxId = document.getElementById('taxId').value.trim();
            const suffix = document.getElementById('suffix').value.trim();
            const ref1 = document.getElementById('ref1').value.trim();
            const ref2 = document.getElementById('ref2').value.trim();
            const amountInput = document.getElementById('amount').value;
            const amount = amountInput ? parseFloat(amountInput) : null;

            // Validation บังคับฟิลด์สำคัญ
            if (taxId.length !== 13 || isNaN(taxId)) {
                alert('กรุณากรอก Tax ID ให้ครบ 13 หลัก');
                return;
            }
            if (suffix.length !== 2) {
                alert('กรุณากรอก Suffix ให้ครบ 2 หลัก (เช่น 00)');
                return;
            }
            if (!ref1) {
                alert('กรุณากรอก Reference 1');
                return;
            }

            // คำนวณรหัส Bill Payment ตามโครงสร้าง EMVCo / BOT Standard
            const target = `${taxId}${suffix}`;
            
            // ใช้ Library promptpayQR สร้าง Payload
            let payload = promptpayQR(target, {
                billPayment: true,
                ref1: ref1,
                ref2: ref2 || null,
                amount: amount
            });

            // แสดงส่วนผลลัพธ์
            document.getElementById('result').classList.remove('hidden');
            document.getElementById('rawPayload').innerText = "Payload: " + payload;

            // ลบ QR เดิมถ้ามี
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";

            // Render QR Code ใหม่
            qrcodeObj = new QRCode(qrContainer, {
                text: payload,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        }
    </script>
</body>
</html>
