<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOT Standard Bill Payment QR Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
        .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h1 { font-size: 20px; text-align: center; color: #1e293b; margin-top: 0; margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus { border-color: #2563eb; }
        .row { display: flex; gap: 10px; }
        .col-1 { flex: 1; }
        .col-2 { flex: 2; }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        button:hover { background: #1d4ed8; }
        
        #result { margin-top: 20px; padding-top: 20px; border-top: 1px solid #e2e8f0; display: none; }
        .qr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 15px; }
        @media (max-width: 480px) { .qr-grid { grid-template-columns: 1fr; } }
        .qr-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; text-align: center; }
        .qr-title { font-size: 13px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
        .qr-sub { font-size: 11px; color: #64748b; margin-bottom: 8px; }
        .qr-render { display: flex; justify-content: center; align-items: center; min-height: 180px; }
        .qr-render img { width: 180px; height: 180px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; padding: 4px; }
        .payload-text { font-size: 10px; color: #64748b; word-break: break-all; margin-top: 8px; text-align: left; background: #fff; padding: 6px; border-radius: 4px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

    <div class="card">
        <h1>BOT Bill Payment QR Generator</h1>

        <form id="qrForm" onsubmit="event.preventDefault(); generateBOTQRCodes();">
            <div class="form-group">
                <label>Tax ID ผู้รับชำระ (13 หลัก)</label>
                <input type="text" id="taxId" maxlength="13" placeholder="1234567890123" required>
            </div>

            <div class="row form-group">
                <div class="col-1">
                    <label>Suffix (2 หลัก)</label>
                    <input type="text" id="suffix" maxlength="2" value="00" required>
                </div>
                <div class="col-2">
                    <label>จำนวนเงิน (บาท)</label>
                    <input type="number" id="amount" step="0.01" placeholder="0.00">
                </div>
            </div>

            <div class="form-group">
                <label>Reference 1 (สูงสุด 20 หลัก)</label>
                <input type="text" id="ref1" maxlength="20" placeholder="REF123456789" required>
            </div>

            <div class="form-group">
                <label>Reference 2 (สูงสุด 20 หลัก - ถ้ามี)</label>
                <input type="text" id="ref2" maxlength="20" placeholder="REF223456789">
            </div>

            <button type="submit">สร้าง BOT Bill Payment QR Code</button>
        </form>

        <div id="result">
            <div class="qr-grid">
                <div class="qr-box">
                    <div class="qr-title">1. BOT Dynamic QR</div>
                    <div class="qr-sub">(ระบุจำนวนเงิน ล็อกยอดชำระ)</div>
                    <div id="qrDynamicContainer" class="qr-render"></div>
                    <div class="payload-text" id="dynamicPayload"></div>
                </div>

                <div class="qr-box">
                    <div class="qr-title">2. BOT Static QR</div>
                    <div class="qr-sub">(ไม่ระบุยอด ให้ผู้จ่ายกรอกเอง)</div>
                    <div id="qrStaticContainer" class="qr-render"></div>
                    <div class="payload-text" id="staticPayload"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // คำนวณ CRC16 CCITT สำหรับ BOT Standard
        function crc16(data) {
            let crc = 0xFFFF;
            for (let i = 0; i < data.length; i++) {
                crc ^= data.charCodeAt(i) << 8;
                for (let j = 0; j < 8; j++) {
                    if ((crc & 0x8000) !== 0) {
                        crc = (crc << 1) ^ 0x1021;
                    } else {
                        crc = crc << 1;
                    }
                }
            }
            return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        }

        function formatTag(id, value) {
            const len = value.length.toString().padStart(2, '0');
            return id + len + value;
        }

        function renderQR(containerId, payloadText) {
            try {
                var qr = qrcode(0, 'M');
                qr.addData(payloadText);
                qr.make();
                document.getElementById(containerId).innerHTML = qr.createImgTag(6, 4);
            } catch (err) {
                console.error("QR Render Error: ", err);
                document.getElementById(containerId).innerText = "ไม่สามารถสร้างภาพ QR ได้";
            }
        }

        function generateBOTQRCodes() {
            var taxId = document.getElementById('taxId').value.trim();
            var suffix = document.getElementById('suffix').value.trim();
            var ref1 = document.getElementById('ref1').value.trim();
            var ref2 = document.getElementById('ref2').value.trim();
            var amountInput = document.getElementById('amount').value;

            if (taxId.length !== 13 || isNaN(taxId)) {
                alert('กรุณากรอก Tax ID ให้ครบ 13 หลัก');
                return;
            }
            if (suffix.length !== 2) {
                alert('กรุณากรอก Suffix ให้ครบ 2 หลัก');
                return;
            }
            if (!ref1) {
                alert('กรุณากรอก Reference 1');
                return;
            }

            // โครงสร้าง Merchant Information ของ BOT Bill Payment (AID: A000000677010112)
            var merchantInfo = formatTag('00', 'A000000677010112');
            merchantInfo += formatTag('01', taxId + suffix);
            merchantInfo += formatTag('02', ref1);
            if (ref2) merchantInfo += formatTag('03', ref2);

            // -------------------------------------------------------------
            // 1. Dynamic BOT QR (ระบุจำนวนเงิน)
            // -------------------------------------------------------------
            var dynamicPayload = formatTag('00', '01');
            dynamicPayload += formatTag('01', '12'); // 12 = Dynamic QR
            dynamicPayload += formatTag('30', merchantInfo);
            dynamicPayload += formatTag('53', '764'); // สกุลเงิน THB
            
            var amountFormatted = (amountInput && !isNaN(amountInput) && parseFloat(amountInput) > 0) 
                ? parseFloat(amountInput).toFixed(2) 
                : '0.00';
            dynamicPayload += formatTag('54', amountFormatted);
            
            dynamicPayload += formatTag('58', 'TH');
            dynamicPayload += '6304';
            dynamicPayload += crc16(dynamicPayload);

            // -------------------------------------------------------------
            // 2. Static BOT QR (ไม่ระบุจำนวนเงิน ให้ลูกค้าพิมพ์ยอดเอง)
            // -------------------------------------------------------------
            var staticPayload = formatTag('00', '01');
            staticPayload += formatTag('01', '11'); // 11 = Static QR
            staticPayload += formatTag('30', merchantInfo);
            staticPayload += formatTag('53', '764');
            // Static จะไม่ใส่ Tag 54 (จำนวนเงิน)
            staticPayload += formatTag('58', 'TH');
            staticPayload += '6304';
            staticPayload += crc16(staticPayload);

            // แสดงผลลัพธ์
            document.getElementById('dynamicPayload').innerText = dynamicPayload;
            renderQR('qrDynamicContainer', dynamicPayload);

            document.getElementById('staticPayload').innerText = staticPayload;
            renderQR('qrStaticContainer', staticPayload);

            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
