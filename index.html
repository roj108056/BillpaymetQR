<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Payment QR Code Generator</title>
    <!-- CSS ตกแต่งหน้าตาแบบเบา ไม่พึ่งพา Library -->
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
        .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { font-size: 20px; text-align: center; color: #1e293b; margin-top: 0; margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus { border-color: #2563eb; }
        .row { display: flex; gap: 10px; }
        .col-1 { flex: 1; }
        .col-2 { flex: 2; }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        button:hover { background: #1d4ed8; }
        #result { margin-top: 20px; padding-top: 20px; border-top: 1px solid #e2e8f0; text-align: center; display: none; }
        #qrImage { width: 200px; height: 200px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; margin: 0 auto; display: block; }
        .payload-text { font-size: 11px; color: #64748b; word-break: break-all; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>สร้าง QR Code ชำระเงิน</h1>

        <form id="qrForm">
            <div class="form-group">
                <label>Tax ID (13 หลัก)</label>
                <input type="text" id="taxId" maxlength="13" placeholder="1234567890123">
            </div>

            <div class="row form-group">
                <div class="col-1">
                    <label>Suffix (2 หลัก)</label>
                    <input type="text" id="suffix" maxlength="2" value="00">
                </div>
                <div class="col-2">
                    <label>จำนวนเงิน (บาท)</label>
                    <input type="number" id="amount" step="0.01" placeholder="0.00">
                </div>
            </div>

            <div class="form-group">
                <label>Reference 1 (สูงสุด 20 หลัก)</label>
                <input type="text" id="ref1" maxlength="20" placeholder="REF123456789">
            </div>

            <div class="form-group">
                <label>Reference 2 (ถ้ามี)</label>
                <input type="text" id="ref2" maxlength="20" placeholder="REF223456789">
            </div>

            <button type="button" id="btnSubmit">สร้าง QR Code</button>
        </form>

        <div id="result">
            <img id="qrImage" src="" alt="QR Code">
            <p class="payload-text" id="rawPayload"></p>
        </div>
    </div>

    <script>
        // คำนวณค่า CRC16 ตามมาตรฐาน EMVCo / PromptPay
        function crc16(data) {
            let crc = 0xFFFF;
            for (let i = 0; i < data.length; i++) {
                crc ^= data.charCodeAt(i) << 8;
                for (let j = 0; j < 8; j++) {
                    if ((crc & 0x8000) !== 0) {
                        crc = (crc << 1) ^ 0x1021;
                    } else {
                        crc = crc << 1;
                    }
                }
            }
            return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        }

        function formatTag(id, value) {
            const len = value.length.toString().padStart(2, '0');
            return id + len + value;
        }

        // ผูก Event ปุ่มกดแบบวานิลลา JS
        document.getElementById('btnSubmit').onclick = function() {
            var taxId = document.getElementById('taxId').value.trim();
            var suffix = document.getElementById('suffix').value.trim();
            var ref1 = document.getElementById('ref1').value.trim();
            var ref2 = document.getElementById('ref2').value.trim();
            var amountInput = document.getElementById('amount').value;

            // ตรวจสอบข้อมูลแบบแจ้งป๊อปอัพ
            if (taxId.length !== 13 || isNaN(taxId)) {
                alert('กรุณากรอก Tax ID ให้ครบ 13 หลัก');
                return;
            }
            if (suffix.length !== 2) {
                alert('กรุณากรอก Suffix ให้ครบ 2 หลัก');
                return;
            }
            if (!ref1) {
                alert('กรุณากรอก Reference 1');
                return;
            }

            // ประกอบ payload
            var merchantInfo = formatTag('00', 'A000000677010112');
            merchantInfo += formatTag('01', taxId + suffix);
            merchantInfo += formatTag('02', ref1);
            if (ref2) merchantInfo += formatTag('03', ref2);

            var payload = formatTag('00', '01');
            payload += formatTag('01', '12');
            payload += formatTag('30', merchantInfo);
            payload += formatTag('53', '764');
            
            if (amountInput && !isNaN(amountInput) && parseFloat(amountInput) > 0) {
                payload += formatTag('54', parseFloat(amountInput).toFixed(2));
            }
            
            payload += formatTag('58', 'TH');
            payload += '6304';
            payload += crc16(payload);

            // แสดงข้อความและดึงรูป QR ผ่าน API ของ Google
            document.getElementById('rawPayload').innerText = "Payload: " + payload;
            document.getElementById('qrImage').src = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(payload);
            document.getElementById('result').style.display = 'block';
        };
    </script>
</body>
</html>
